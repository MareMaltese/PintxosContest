services:
  - type: web
    name: pincho-party-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/contest
    envVars:
      - key: NODE_ENV
        value: production
      # Without this, `npm ci` omits devDependencies (typescript, @types/*, vitest...)
      # whenever NODE_ENV=production is set, which breaks the TypeScript build step.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_PIN
        sync: false
